

<!DOCTYPE html>

<html>

<head>

    <title>Sweet Bakery</title>

    <style>

        body {

            font-family: Arial;

            text-align: center;

            background-color: #fff0f5;

        }

        .item {

            display: inline-block;

            background: white;

            border: 1px solid pink;

            padding: 15px;

            margin: 10px;

        }

        button {

            background-color: #e75480;

            color: white;

            border: none;

            padding: 8px;

        }

    </style>

</head>

<body>

    <h1>Sweet Bakery</h1>

    <p>Fresh and delicious treats every day!</p>

    <div class="item">

        <h2>Chocolate Cake</h2>

        <p>$15</p>

        <button>Order Now</button>

    </div>

    <div class="item">

        <h2>Cookies</h2>

        <p>$5</p>

        <button>Order Now</button>

    </div>

    <div class="item">

        <h2>Cupcake</h2>

        <p>$3</p>

        <button>Order Now</button>

    </div>

</body>

</html>
